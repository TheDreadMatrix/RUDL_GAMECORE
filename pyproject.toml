[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rudlgc"
version = "0.1.0"
description = "Daemon`s RUDL Game Core Engine"
authors = [
  { name="DaemonDuck", email="simulasimulasimula15@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pysdl2==0.9.17",
  "pysdl2-dll==2.32.0", 
  "moderngl==5.12.0", 
  "PyGLM==2.8.3",
  "pillow==12.2.0",
  "platformdirs==4.9.4",
  "pyinstaller",
  "easygui==0.98.3"
]

[tool.setuptools]
package-dir = {"" = "rudlgc"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"rudlgc" = [
  "stuff/*.png",
  "stuff/*.jpg",
  "stuff/*.ttf",
  "stuff/*.ogg",
  "stuff/*.wav",
  "stuff/*.vert",
  "stuff/*.frag"
]

[project.scripts]
rudlgc-admin = "rudlgc.core.execute_prompt:_rudlgc_admin"
rudlgc-debug = "rudlgc.core.execute_debug_server:main"